<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

/* Balloons */
.balloon{
    position:absolute;
    bottom:-150px;
    width:60px;
    height:80px;
    border-radius:50%;
    animation:floatUp linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:2px;
    height:80px;
    background:white;
    top:80px;
    left:50%;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

.container{
    z-index:2;
    color:white;
    padding:20px;
}

h1{
    font-size:3rem;
    margin-bottom:20px;
}

.message{
    font-size:1.3rem;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4081;
    font-size:1rem;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-content{
    background:white;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:450px;
}

.popup-content h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:15px;
}

#finalMessage{
    margin-top:30px;
    font-size:1.3rem;
    display:none;
}

canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">
    <h1>🎂 Happy Birthday Shivangi 🎂</h1>

    <p class="message">
        To get your gift, enter the game by clicking the button below.
    </p>

    <button onclick="startGame()">🎁 Start Game</button>

    <div id="finalMessage">
        <h2>🎉 Treasure Hunt Begins! 🎉</h2>
        <br>
        <p><strong>Let's go for a treasure hunt: here's your first clue...</strong></p>
        <br>
        <p>🔍 Clue #1:</p>
        <p>Look where dreams rest every night.</p>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        <h2 id="question"></h2>

        <input id="answer" type="text" placeholder="Type answer">

        <button onclick="checkAnswer()">Submit</button>
    </div>
</div>

<!-- Optional Music -->
<!--
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
-->

<script>

/* QUESTIONS */

const questions = [
{
question:"Question 1: What is my favourite colour?",
answer:"blue"
},
{
question:"Question 2: Which city did we first meet in?",
answer:"delhi"
},
{
question:"Question 3: My favourite food?",
answer:"pizza"
},
{
question:"Question 4: What nickname do I call you?",
answer:"angel"
},
{
question:"Question 5: What month is your birthday?",
answer:"august"
}
];

let currentQuestion = 0;

function startGame(){
    currentQuestion = 0;
    document.getElementById("popup").style.display="flex";
    loadQuestion();
}

function loadQuestion(){
    document.getElementById("question").innerText =
    questions[currentQuestion].question;

    document.getElementById("answer").value="";
}

function checkAnswer(){

    const userAnswer =
    document.getElementById("answer")
    .value
    .trim()
    .toLowerCase();

    if(userAnswer === questions[currentQuestion].answer.toLowerCase()){

        currentQuestion++;

        if(currentQuestion < questions.length){
            loadQuestion();
        }
        else{
            document.getElementById("popup").style.display="none";

            document.getElementById("finalMessage").style.display="block";

            startConfetti();
        }

    }else{
        alert("❌ Wrong answer. Try again!");
    }
}

/* BALLOONS */

const colors = [
"#ff4d6d",
"#4dabf7",
"#ffd43b",
"#69db7c",
"#b197fc"
];

for(let i=0;i<20;i++){

    let balloon = document.createElement("div");

    balloon.classList.add("balloon");

    balloon.style.left=Math.random()*100+"%";

    balloon.style.background=
    colors[Math.floor(Math.random()*colors.length)];

    balloon.style.animationDuration=
    (8 + Math.random()*8)+"s";

    balloon.style.opacity=.8;

    document.body.appendChild(balloon);
}

/* CONFETTI */

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confettiPieces=[];

function startConfetti(){

    for(let i=0;i<300;i++){

        confettiPieces.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height-canvas.height,
            r:Math.random()*6+2,
            d:Math.random()*300
        });
    }

    animateConfetti();
}

function animateConfetti(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    confettiPieces.forEach((p,index)=>{

        ctx.beginPath();

        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

        ctx.fillStyle=
        colors[index % colors.length];

        ctx.fill();

        p.y += 3;

        if(p.y > canvas.height){
            p.y = -10;
        }
    });

    requestAnimationFrame(animateConfetti);
}

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
