<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

/* BALLOONS */
.balloon{
    position:absolute;
    bottom:-150px;
    width:60px;
    height:80px;
    border-radius:50%;
    animation:floatUp linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:2px;
    height:80px;
    background:white;
    top:80px;
    left:50%;
}

@keyframes floatUp{
    from{transform:translateY(0);}
    to{transform:translateY(-120vh);}
}

.container{
    z-index:2;
    color:white;
    padding:20px;
}

h1{
    font-size:3rem;
    margin-bottom:25px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4081;
    font-size:1rem;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

/* POPUP */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-content{
    background:white;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:450px;
    color:black;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:15px;
}

/* FINAL MESSAGE */
#finalMessage{
    display:none;
    margin-top:20px;
    font-size:1.3rem;
}

/* CONFETTI */
canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

    <h1>🎂Happy Birthday🎂/n
        🎀Shivangi🎀</h1>

    <button id="startBtn" onclick="startGame()">🎁 Start Game</button>

    <div id="finalMessage">
        <h2>🎉 Treasure Hunt Begins! 🎉</h2>
        <br>
        <p><b>Here's your first clue...</b></p>
        <br>
        <p>🔍 Clue #1:</p>
        <p></p>This box is empty, but your day won't be, I've hidden little pieces of you and me 
        Start where you sip something warm and light, Your green tea spot will guide you right</p>
    </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2 id="question"></h2>

        <input id="answer" type="text" placeholder="Type your answer">

        <button onclick="checkAnswer()">Submit</button>
    </div>
</div>

<script>

/* QUESTIONS */
const questions = [
{ question:"What is my favourite colour?", answer:"blue" },
{ question:"Which city did we first meet in?", answer:"delhi" },
{ question:"My favourite food?", answer:"pizza" },
/*{ question:"What nickname do I call you?", answer:"angel" },*/
{ question:"What month is your birthday?", answer:"august" }
];

let currentQuestion = 0;

/* START GAME */
function startGame(){
    currentQuestion = 0;
    document.getElementById("popup").style.display="flex";
    document.getElementById("startBtn").style.display="none";
    loadQuestion();
}

/* LOAD QUESTION */
function loadQuestion(){
    document.getElementById("question").innerText =
    questions[currentQuestion].question;

    document.getElementById("answer").value="";
}

/* CHECK ANSWER */
function checkAnswer(){

    const userAnswer =
    document.getElementById("answer").value.trim().toLowerCase();

    if(userAnswer === questions[currentQuestion].answer.toLowerCase()){

        currentQuestion++;

        if(currentQuestion < questions.length){
            loadQuestion();
        }
        else{
            document.getElementById("popup").style.display="none";
            document.getElementById("finalMessage").style.display="block";
            startConfetti();
        }

    } else {
        alert("❌ Wrong answer! Try again.");
    }
}

/* BALLOONS */
const colors = ["#ff4d6d","#4dabf7","#ffd43b","#69db7c","#b197fc"];

for(let i=0;i<20;i++){
    let balloon = document.createElement("div");
    balloon.classList.add("balloon");
    balloon.style.left=Math.random()*100+"%";
    balloon.style.background=colors[Math.floor(Math.random()*colors.length)];
    balloon.style.animationDuration=(6+Math.random()*6)+"s";
    balloon.style.opacity=.8;
    document.body.appendChild(balloon);
}

/* CONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let pieces=[];

function startConfetti(){
    for(let i=0;i<250;i++){
        pieces.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height-canvas.height,
            r:Math.random()*6+2
        });
    }
    animate();
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    pieces.forEach((p,i)=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        p.y += 3;

        if(p.y > canvas.height){
            p.y = -10;
        }
    });

    requestAnimationFrame(animate);
}

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
